apiVersion: apps/v1
kind: Deployment
metadata:
  name: smarthome-kafka-broker-2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smarthome-kafka-broker-2
  template:
    metadata:
      labels:
        app: smarthome-kafka-broker-2
    spec:
      containers:
        - name: kafka
          image: cr.selcloud.ru/smart-home/kafka:1
          ports:
            - containerPort: 9093
          env:
            - name: KAFKA_BROKER_ID
              value: "2"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "smarthome-zookeeper:2181"
            - name: ALLOW_PLAINTEXT_LISTENER
              value: "yes"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://smarthome-kafka-broker-2:9093"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9093"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "2"
---
apiVersion: v1
kind: Service
metadata:
  name: smarthome-kafka-broker-2
spec:
  ports:
    - port: 9093
      targetPort: 9093
  selector:
    app: smarthome-kafka-broker-2