apiVersion: apps/v1
kind: Deployment
metadata:
  name: smarthome-zookeeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smarthome-zookeeper
  template:
    metadata:
      labels:
        app: smarthome-zookeeper
    spec:
      containers:
        - name: zookeeper
          image: cr.selcloud.ru/smart-home/zookeeper:1
          ports:
            - containerPort: 2181
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"