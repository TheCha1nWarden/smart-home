apiVersion: apps/v1
kind: Deployment
metadata:
  name: smarthome-kafka-broker-2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smarthome-kafka-broker-2
  template:
    metadata:
      labels:
        app: smarthome-kafka-broker-2
    spec:
      initContainers:
        - name: init-chown
          image: busybox
          command: 
            - sh
            - "-c"
            - |
              chown -R 1000:1000 /var/lib/kafka/data
              rm -rf /var/lib/kafka/data/smarthome/meta.properties
          volumeMounts:
            - name: kafka-storage
              mountPath: /var/lib/kafka/data
      containers:
        - name: kafka
          image: cr.selcloud.ru/smart-home/kafka:1
          ports:
            - containerPort: 9093
          env:
            - name: KAFKA_BROKER_ID
              value: "2"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "smarthome-zookeeper:2181"
            - name: ALLOW_PLAINTEXT_LISTENER
              value: "yes"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://smarthome-kafka-broker-2:9093"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9093"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "2"
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data/smarthome
          volumeMounts:
            - name: kafka-storage
              mountPath: /var/lib/kafka/data
      volumes:
        - name: kafka-storage
          persistentVolumeClaim:
            claimName: kafka-2-pv-claim
---
apiVersion: v1
kind: Service
metadata:
  name: smarthome-kafka-broker-2
spec:
  ports:
    - port: 9093
      targetPort: 9093
  selector:
    app: smarthome-kafka-broker-2