version: '3.8'

services:
  smarthome-zookeeper:
    image: confluentinc/cp-zookeeper:latest
    hostname: zookeeper
    container_name: smarthome-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  smarthome-kafka-broker-1:
    image: confluentinc/cp-kafka:latest
    hostname: kafka-broker-1
    container_name: smarthome-kafka-broker-1
    depends_on:
      - smarthome-zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka-broker-1:29092,OUTSIDE://localhost:9092
      KAFKA_LISTENERS: INSIDE://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2

  smarthome-kafka-broker-2:
    image: confluentinc/cp-kafka:latest
    hostname: kafka-broker-2
    container_name: smarthome-kafka-broker-2
    depends_on:
      - smarthome-zookeeper
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka-broker-2:29093,OUTSIDE://localhost:9093
      KAFKA_LISTENERS: INSIDE://0.0.0.0:29093,OUTSIDE://0.0.0.0:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2

  smarthome-kafka-ui-cont:
    image: provectuslabs/kafka-ui:latest
    hostname: kafka-ui
    container_name: smarthome-kafka-ui-cont
    depends_on:
      - smarthome-kafka-broker-1
      - smarthome-kafka-broker-2
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-broker-1:29092,kafka-broker-2:29093

  smarthome-postgres:
    image: postgres:latest
    container_name: smarthome-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - pgdata-smarthome:/var/lib/postgresql/data

  smarthome-auth-service:
    image: auth-service:1
    container_name: auth-service
    ports:
      - "8082:8082"
    environment:
      JWT_SECRET_KEY: yourSecretasdqewjldsandmhqqwjendsbahjsdbasmd
      SPRING_DATASOURCE_URL: jdbc:postgresql://smarthome-postgres:5432/authdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      - smarthome-postgres

  smarthome-device-service:
    image: device-service:1
    container_name: device-service
    ports:
      - "8081:8081"
    environment:
      JWT_SECRET_KEY: yourSecretasdqewjldsandmhqqwjendsbahjsdbasmd
      SPRING_DATASOURCE_URL: jdbc:postgresql://smarthome-postgres:5432/devicedb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root
      TOPIC_NOTIFICATION: topic-notification
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker-1:29092,kafka-broker-2:29093
    depends_on:
      - smarthome-postgres
      - smarthome-kafka-broker-1
      - smarthome-kafka-broker-2

  smarthome-integration-service:
    image: integration-service:1
    container_name: integration-service
    ports:
      - "8084:8084"
    environment:
      JWT_SECRET_KEY: yourSecretasdqewjldsandmhqqwjendsbahjsdbasmd
      WEATHER_API_KEY: f3304718673143573a03db8b5ec68485
      WEATHER_API_BASEURL: https://api.openweathermap.org
      WEATHER_API_PATH: /data/2.5/weather
       
  smarthome-notification-service:
    image: notification-service:1
    container_name: notification-service
    ports:
      - "8083:8083"
    environment:
      JWT_SECRET_KEY: yourSecretasdqewjldsandmhqqwjendsbahjsdbasmd
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: home.zen152@gmail.com
      SPRING_MAIL_PASSWORD: dzqc zljj kwzb ugrx
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker-1:29092,kafka-broker-2:29093
      KAFKA_TOPIC_SENSOR_NOTIFICATION: sensor-notifications
      KAFKA_CONSUMER_GROUP_ID: sensor-notifications-group
    depends_on:
      - smarthome-kafka-broker-1
      - smarthome-kafka-broker-2
    

volumes:
  pgdata-smarthome: